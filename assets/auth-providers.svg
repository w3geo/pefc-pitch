<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="ui-sans-serif,system-ui,sans-serif">

  <!-- Category headers -->
  <rect x="10" y="8" width="430" height="24" rx="4" fill="#dcfce7"/>
  <text x="225" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d" letter-spacing="0.8">BETRIEBSBEZOGEN</text>

  <rect x="450" y="8" width="240" height="24" rx="4" fill="#dbeafe"/>
  <text x="570" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8" letter-spacing="0.8">PERSONENBEZOGEN</text>

  <!-- eAMA card -->
  <rect x="10" y="40" width="200" height="150" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="110" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">eAMA</text>
  <line x1="25" y1="76" x2="195" y2="76" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="25" y="88" width="170" height="26" rx="4" fill="#dcfce7"/>
  <text x="110" y="105" text-anchor="middle" font-size="11" fill="#166534">LFBIS-Nummer verfügbar</text>

  <!-- USP card -->
  <rect x="220" y="40" width="220" height="150" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="330" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">USP</text>
  <line x1="235" y1="76" x2="425" y2="76" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="240" y="88" width="180" height="26" rx="4" fill="#dcfce7"/>
  <text x="330" y="105" text-anchor="middle" font-size="11" fill="#166534">LFBIS-Nummer verfügbar</text>
  <rect x="240" y="122" width="180" height="28" rx="14" fill="#15803d"/>
  <text x="330" y="140" text-anchor="middle" font-size="11" fill="white">Mitarbeiterdelegierung</text>
  <rect x="240" y="158" width="180" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="330" y="174" text-anchor="middle" font-size="10" fill="#64748b">auch ohne LFBIS-Nummer</text>

  <!-- ID Austria card -->
  <rect x="450" y="40" width="240" height="150" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="570" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">ID Austria</text>
  <line x1="465" y1="76" x2="675" y2="76" stroke="#bfdbfe" stroke-width="1"/>
  <text x="570" y="105" text-anchor="middle" font-size="11" fill="#3b82f6">für natürliche Personen</text>

  <!-- Common Adressregister bar -->
  <rect x="10" y="204" width="680" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="350" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Alle drei</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="#6b7280">Adressen aus dem amtlichen Adressregister</text>

</svg>
