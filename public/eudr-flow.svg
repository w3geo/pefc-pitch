<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" font-family="ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="140" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="1">STANDARD-PROZESS</text>
  <text x="560" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="1">ALTERNATIV</text>

  <!-- Dashed separator -->
  <line x1="350" y1="26" x2="350" y2="272" stroke="#e5e7eb" stroke-dasharray="5,4" stroke-width="1"/>

  <!-- Standard: Box 1 – App drafts DDS -->
  <rect x="30" y="30" width="220" height="54" rx="7" fill="#15803d"/>
  <text x="140" y="51" text-anchor="middle" font-size="12" fill="white">App erstellt</text>
  <text x="140" y="68" text-anchor="middle" font-size="12" fill="white">Sorgfaltserklärung (Entwurf)</text>

  <line x1="140" y1="84" x2="140" y2="106" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Standard: Box 2 – User confirms -->
  <rect x="30" y="108" width="220" height="44" rx="7" fill="#15803d"/>
  <text x="140" y="135" text-anchor="middle" font-size="12" fill="white">Nutzer bestätigt ✓</text>

  <line x1="140" y1="152" x2="140" y2="174" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Standard: PEFC badge (pill) -->
  <rect x="30" y="176" width="220" height="46" rx="23" fill="#16a34a"/>
  <text x="140" y="196" text-anchor="middle" font-size="11" fill="white">PEFC als bevollmächtigter</text>
  <text x="140" y="213" text-anchor="middle" font-size="11" fill="white">Vertreter aller Mitglieder</text>

  <!-- Alternative: Box -->
  <rect x="450" y="108" width="220" height="54" rx="7" fill="#1d4ed8"/>
  <text x="560" y="130" text-anchor="middle" font-size="12" fill="white">Nutzer gibt bestehende</text>
  <text x="560" y="148" text-anchor="middle" font-size="12" fill="white">Referenznummer ein</text>

  <!-- Converging arms to join point (350, 268) -->
  <polyline points="140,222 140,268 350,268" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <polyline points="560,162 560,268 350,268" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="350" y1="268" x2="350" y2="286" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DB box -->
  <rect x="230" y="288" width="240" height="44" rx="7" fill="#1e3a5f"/>
  <text x="350" y="315" text-anchor="middle" font-size="12" fill="white">Referenznummer in Datenbank</text>

  <!-- Arrow to TRACES -->
  <line x1="350" y1="332" x2="350" y2="354" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="358" y="346" font-size="10" fill="#9ca3af" font-style="italic">Detailabfragen</text>

  <!-- TRACES box -->
  <rect x="230" y="356" width="240" height="50" rx="7" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="350" y="378" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">TRACES-Datenbank</text>
  <text x="350" y="396" text-anchor="middle" font-size="10" fill="#9ca3af">Single Source of Truth für EUDR-Daten</text>
</svg>
